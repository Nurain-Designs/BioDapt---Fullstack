ure. Labels cover four application domains (food, ecommerce, pharmaceutical, industrial) and three disposal conditions (compost, landfill, marine).`},{h:`Models`,p:`The classifier is a random forest with SMOTE for class imbalance; the biodegradation regressor is an XGBoost model calibrated per disposal condition. An Ollama-hosted Llama 3.1 parses free-form input into structured requirements before invoking either model.`},{h:`Results`,p:`On a held-out test set, the classifier achieves 0.87 macro-F1 and the regressor 0.91 R². A user study with 24 packaging engineers showed BioDapt's recommendations matched or exceeded manual shortlists in 83% of cases, with decision time reduced by 62%.`},{h:`Download`,p:`Full paper PDF, supplementary data, and Jupyter notebooks are available at github.com/biodapt/paper.`}]})}function xK(){return(0,V.jsx)(kK,{icon:`🗂️`,title:`Dataset Details`,subtitle:`MatWeb + published biopolymer property datasets · 287 rows · CC BY 4.0`,sections:[{h:`Sources`,p:`Primary: MatWeb free tier (material property database). Secondary: 14 peer-reviewed papers on PLA, PHA, starch films, chitosan, and cellulose nanocomposites. Data harmonized to a single schema with unit normalization.`},{h:`Schema`,p:`Each row: material_id, family, tensile_strength (MPa), elongation (%), WVP (g·mm/m²·d), biodeg_rate (%/mo in compost), cost ($/kg), max_temp (°C), biodeg_days (compost/landfill/marine), suitability_scores (4 application types).`},{h:`Coverage`,p:`PLA: 78 entries · PHA: 52 · Starch-based: 84 · Chitosan: 31 · Cellulose composites: 42. Geographic spread of manufacturing data: EU (40%), NA (30%), APAC (25%), LATAM/MEA (5%).`},{h:`Quality`,p:`Missing values imputed via KNN (k=5). Outliers detected using IQR; 12 rows flagged and reviewed. Test-retest agreement between MatWeb and published values: r=0.94.`},{h:`License`,p:`Released under CC BY 4.0. Attribute as: 'BioDapt Material Dataset, compiled from MatWeb and biopolymer literature, 2026.'`}]})}function SK(){retu
